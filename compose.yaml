services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: family_menu
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: family_menu
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - family-menu-db:/var/lib/postgresql/data
      - ./db/local-init.sql:/docker-entrypoint-initdb.d/01-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U family_menu -d family_menu']
      interval: 3s
      timeout: 3s
      retries: 10
volumes:
  family-menu-db:
