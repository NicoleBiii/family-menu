version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # TypeScript stays on 6.x until typescript-eslint and @nestjs/swagger support 7 (ADR 0001).
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # Node type definitions track the runtime major pinned in .nvmrc (Node 24).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
