name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: family_menu
          POSTGRES_PASSWORD: local-development-only
          POSTGRES_DB: family_menu_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U family_menu -d family_menu_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://family_menu:local-development-only@127.0.0.1:5432/family_menu_test
      TEST_DATABASE_URL: postgresql://family_menu:local-development-only@127.0.0.1:5432/family_menu_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run openapi && git diff --exit-code -- docs/api/openapi.json
      - run: npm audit --omit=dev --audit-level=high
      - name: Build deployment image
        run: docker build --tag family-menu:${{ github.sha }} .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
