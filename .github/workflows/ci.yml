name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: family_menu
          POSTGRES_PASSWORD: local-development-only
          POSTGRES_DB: family_menu_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U family_menu -d family_menu_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://family_menu:local-development-only@127.0.0.1:5432/family_menu_test
      TEST_DATABASE_URL: postgresql://family_menu:local-development-only@127.0.0.1:5432/family_menu_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run openapi && git diff --exit-code -- docs/api/openapi.json
      - run: npm audit --omit=dev --audit-level=high
      - name: Build deployment image
        run: docker build --tag family-menu:${{ github.sha }} .
      # Runs the image the way Railway does: the pre-deploy migration, then the server with its
      # readiness check. Uses a fresh database so migrations start from nothing.
      - name: Start deployment image
        run: |
          docker exec "$(docker ps -q --filter ancestor=postgres:17)" \
            psql -U family_menu -d family_menu_test -c 'create database family_menu_image'
          url=postgresql://family_menu:local-development-only@127.0.0.1:5432/family_menu_image
          docker run --rm --network host -e DATABASE_URL="$url" \
            family-menu:${{ github.sha }} node scripts/migrate.mjs
          docker run -d --name app --network host -e DATABASE_URL="$url" -e PORT=3300 \
            -e APP_ORIGIN=https://preview.example.test family-menu:${{ github.sha }}
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3300/api/health/ready; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3300/api/health/ready
          curl -fsS http://127.0.0.1:3300/ | grep -q '<div id="root">'
          docker logs app
          docker rm -f app
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
